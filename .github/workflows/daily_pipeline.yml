name: Daily Etsy Pipeline

on:
  schedule:
    # Runs every day at 09:00 UTC (02:00 IST).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      niche:
        description: "Seed niche (default: digital daily planner)"
        required: false
        default: "digital daily planner"

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (fully offline)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m unittest discover -s tests -v

      - name: Run daily pipeline in dry-run mode
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          # Telegram / Discord notifications are optional.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py "${{ inputs.niche || 'digital daily planner' }}" --dry-run

      - name: Upload generated assets and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listing-output
          path: |
            output/
            etsyauto.db
            logs/
          if-no-files-found: ignore
          retention-days: 14